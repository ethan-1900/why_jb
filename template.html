  <style>
    body{position:relative;isolation:isolate}
    .ambient-background{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--paper)}
    .ambient-layer{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;transition:opacity .18s linear;will-change:opacity}
    .ambient-layer--first{background-image:url("assets/jb-stage-background.jpg");background-position:center 28%;opacity:.2}
    .ambient-layer--second{background-image:url("assets/jb-hood-background.jpg");background-position:center 62%;opacity:0}
    .ambient-layer--third{background-image:url("assets/jb-stage-mono-background.jpg");background-position:center 58%;opacity:0}
    .ambient-background::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(248,246,241,.12),rgba(248,246,241,.38) 78%)}
    body>header,body>main,body>footer{position:relative;z-index:1}
    article,blockquote{font-size:22px}
    article strong{background:transparent;padding:0;font-style:italic;font-weight:700}
    .compact-image{width:80%;max-width:430px;margin-left:auto;margin-right:auto}
    @media(max-width:700px){.ambient-layer--first{background-position:58% center}.ambient-layer--second{background-position:48% center}.ambient-layer--third{background-position:58% center}article,blockquote{font-size:21px}}
  </style>

  <script>
    (()=>{
      const layers=[...document.querySelectorAll('.ambient-layer')];
      let scheduled=false;
      const draw=()=>{
        const range=Math.max(1,document.documentElement.scrollHeight-innerHeight);
        const progress=Math.min(1,Math.max(0,scrollY/range));
        let weights;
        if(progress<=.5){const mix=progress*2;weights=[1-mix,mix,0]}
        else{const mix=(progress-.5)*2;weights=[0,1-mix,mix]}
        layers.forEach((layer,index)=>layer.style.opacity=(weights[index]*.2).toFixed(3));
        scheduled=false;
      };
      const update=()=>{if(!scheduled){scheduled=true;requestAnimationFrame(draw)}};
      addEventListener('scroll',update,{passive:true});
      addEventListener('resize',update);
      draw();
    })();
  </script>
