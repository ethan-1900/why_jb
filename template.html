    body{position:relative;isolation:isolate}

    body>header,body>main,body>footer{position:relative;z-index:1}

  <button class="bgm-toggle" type="button" hidden aria-pressed="false" aria-label="背景音乐：点击播放">
    <span class="bgm-icon" aria-hidden="true">♪</span>
    <span class="bgm-bars" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="bgm-label">背景音乐</span>
  </button>
  <audio id="bgm" src="assets/audio/bgm.mp3" loop preload="metadata"></audio>
  <script>
    (()=>{
      const audio=document.getElementById('bgm');
      const toggle=document.querySelector('.bgm-toggle');
      if(!audio||!toggle) return;
      const TARGET_VOLUME=.25;      // 音量（0–1），想更轻就调小这里
      const FADE_MS=1600;           // 起播淡入时长，避免突然出声
      let fade=null,userPaused=false,lastAttempt=0;
      audio.volume=0;
      const fadeTo=(to,ms)=>{
        clearInterval(fade);
        const from=audio.volume,steps=Math.max(1,Math.round(ms/60));
        let step=0;
        fade=setInterval(()=>{
          step+=1;
          audio.volume=Math.min(1,Math.max(0,from+(to-from)*step/steps));
          if(step>=steps) clearInterval(fade);
        },60);
      };
      const sync=()=>{
        const playing=!audio.paused;
        toggle.classList.toggle('is-playing',playing);
        if(playing) toggle.classList.remove('is-blocked');
        toggle.setAttribute('aria-pressed',playing?'true':'false');
        toggle.setAttribute('aria-label',playing?'背景音乐：点击暂停':'背景音乐：点击播放');
      };
      const play=()=>audio.play().then(()=>{fadeTo(TARGET_VOLUME,FADE_MS);sync()}).catch(()=>{
        toggle.classList.add('is-blocked');   // 浏览器拦截了有声自动播放，等用户第一次交互
      });
      audio.addEventListener('error',()=>{clearInterval(fade);toggle.hidden=true});
      audio.addEventListener('loadedmetadata',()=>{toggle.hidden=false});
      audio.addEventListener('play',sync);
      audio.addEventListener('pause',()=>{clearInterval(fade);audio.volume=0;sync()});
      toggle.addEventListener('click',()=>{
        if(audio.paused){userPaused=false;play()}else{userPaused=true;audio.pause()}
      });
      ['pointerdown','keydown','touchstart','scroll'].forEach(type=>addEventListener(type,()=>{
        if(!audio.paused||userPaused) return;
        const now=Date.now();
        if(now-lastAttempt<1200) return;
        lastAttempt=now;
        play();
      },{passive:true}));
      document.addEventListener('visibilitychange',()=>{if(document.hidden) audio.pause()});
      play();
    })();
  </script>
  <script>
    (()=>{
      const layers=[...document.querySelectorAll('.ambient-layer')];
      let scheduled=false;
      const draw=()=>{
        const range=Math.max(1,document.documentElement.scrollHeight-innerHeight);
        const progress=Math.min(1,Math.max(0,scrollY/range));
        let weights;
        if(progress<=.5){const mix=progress*2;weights=[1-mix,mix,0]}
        else{const mix=(progress-.5)*2;weights=[0,1-mix,mix]}
        layers.forEach((layer,index)=>layer.style.opacity=(weights[index]*.2).toFixed(3));
        scheduled=false;
      };
      const update=()=>{if(!scheduled){scheduled=true;requestAnimationFrame(draw)}};
      addEventListener('scroll',update,{passive:true});
      addEventListener('resize',update);
      draw();
    })();
  </script>
